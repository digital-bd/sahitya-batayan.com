<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ই-পেপার | সাহিত্য বাতায়ন</title><meta name="description" content="সাহিত্য বাতায়নের সাপ্তাহিক ই-পেপার সংখ্যা ও ডিজিটাল আর্কাইভ।"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&family=Noto+Serif+Bengali:wght@500;600;700;800&display=swap" rel="stylesheet"><style>
:root{--red:#941f2b;--navy:#172b46;--gold:#b99651;--ink:#20242a;--muted:#73777d;--line:#e6e2dc;--soft:#f7f5f1}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font-family:'Noto Sans Bengali',sans-serif;line-height:1.7}a{color:inherit;text-decoration:none}.top{background:var(--navy);color:#fff;padding:8px 16px;font-size:13px}.wrap{width:min(1120px,calc(100% - 30px));margin:auto}.mast{padding:22px 0;border-bottom:3px solid var(--red);display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font:800 clamp(28px,5vw,44px) 'Noto Serif Bengali',serif;color:var(--red)}.mast a.back{border:1px solid var(--line);padding:8px 12px;border-radius:4px;color:var(--navy)}h1{font:800 27px 'Noto Serif Bengali',serif;color:var(--navy);margin:25px 0 5px}.intro{color:var(--muted);margin:0 0 20px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.card{border:1px solid var(--line);background:#fff;padding:14px;border-radius:6px}.cover{width:100%;aspect-ratio:3/4;object-fit:cover;background:var(--soft);border:1px solid var(--line)}.card h2{font:700 18px 'Noto Serif Bengali',serif;color:var(--navy);margin:10px 0 3px}.meta{font-size:12px;color:var(--muted)}.desc{font-size:13px;color:#505762}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{display:inline-block;padding:8px 12px;background:var(--red);color:#fff;border-radius:4px;font-size:13px;font-weight:700}.btn.alt{background:var(--navy)}.reader{margin:20px 0;border:1px solid var(--line);background:var(--soft);padding:12px}.reader iframe{width:100%;height:min(78vh,900px);border:0;background:#fff}.empty{padding:30px;text-align:center;color:var(--muted);background:var(--soft)}footer{margin-top:50px;padding:22px;background:var(--navy);color:#fff;text-align:center;font-size:13px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){.grid{grid-template-columns:1fr}.mast{align-items:flex-start;flex-direction:column}.mast a.back{align-self:flex-end}}
</style></head><body><div class="top">সাহিত্য, সংবাদ ও মননের দর্পণ</div><header class="wrap mast"><a class="brand" href="index.html">সাহিত্য বাতায়ন</a><a class="back" href="index.html">← প্রচ্ছদে ফিরুন</a></header><main class="wrap"><h1>সাপ্তাহিক ই-পেপার</h1><p class="intro">প্রতি সপ্তাহের প্রকাশিত সংখ্যা পড়ুন, PDF ডাউনলোড করুন এবং পুরোনো সংখ্যার আর্কাইভ ঘুরে দেখুন।</p><div id="issueList" class="grid"><div class="empty">ই-পেপার আনা হচ্ছে…</div></div><section id="reader" class="reader" hidden></section></main><footer>© সাহিত্য বাতায়ন · সাপ্তাহিক ডিজিটাল প্রকাশনা</footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=window.supabase.createClient('https://wiaovopnunhdzcjfchkv.supabase.co','sb_publishable_A4bEGZp8sZyRBTC1MmY61A_wFWf6Eld');const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const date=s=>s?new Intl.DateTimeFormat('bn-BD',{day:'numeric',month:'long',year:'numeric'}).format(new Date(s)):'';function safeUrl(s){if(!s)return '';try{const u=new URL(s);return ['https:','http:'].includes(u.protocol)?u.href:''}catch(e){return ''}}
async function load(){const {data,error}=await db.from('epaper_issues').select('id,issue_no,title,subtitle,description,cover_image_url,pdf_url,html_url,edition_date').eq('is_published',true).order('edition_date',{ascending:false}).limit(200);if(error){$('issueList').innerHTML='<div class="empty">ই-পেপার লোড করা যায়নি। ডেটাবেস Migration ও RLS Policy যাচাই করুন।<br>'+esc(error.message)+'</div>';return}const rows=data||[];$('issueList').innerHTML=rows.map(x=>`<article class="card"><img class="cover" src="${esc(safeUrl(x.cover_image_url)||'')}" alt="${esc(x.title)}" onerror="this.style.display='none'"><div class="meta">${esc(x.issue_no)} · ${date(x.edition_date)}</div><h2>${esc(x.title)}</h2><div class="meta">${esc(x.subtitle||'')}</div><p class="desc">${esc(x.description||'')}</p><div class="actions">${x.pdf_url?`<button class="btn" data-pdf="${esc(safeUrl(x.pdf_url))}">PDF পড়ুন</button><a class="btn alt" href="${esc(safeUrl(x.pdf_url))}" target="_blank" rel="noopener">PDF ডাউনলোড</a>`:''}${x.html_url?`<button class="btn alt" data-html="${esc(safeUrl(x.html_url))}" data-title="${esc(x.title)}">HTML পড়ুন</button>`:''}</div></article>`).join('')||'<div class="empty">এখনো কোনো ই-পেপার সংখ্যা প্রকাশিত হয়নি।</div>';const id=new URLSearchParams(location.search).get('id');if(id){const item=rows.find(x=>x.id===id);if(item){if(item.pdf_url)openPdf(item);else if(item.html_url)openHtml(item.html_url,item.title);}}}
function openPdf(x){const u=safeUrl(x.pdf_url);if(!u)return;const reader=$('reader');reader.hidden=false;reader.innerHTML=`<h2>${esc(x.issue_no)} · ${esc(x.title)}</h2><iframe title="ই-পেপার PDF" src="${esc(u)}#toolbar=1&navpanes=0"></iframe>`;reader.scrollIntoView({behavior:'smooth'});}function openHtml(url,title){const u=safeUrl(url);if(!u)return;const reader=$('reader');reader.hidden=false;reader.innerHTML=`<h2>${esc(title)}</h2><iframe title="ই-পেপার HTML" sandbox src="${esc(u)}" style="width:100%;height:80vh;border:0;background:#fff"></iframe>`;reader.scrollIntoView({behavior:'smooth'});}document.addEventListener('click',e=>{const b=e.target.closest('[data-pdf]');if(b){const u=safeUrl(b.dataset.pdf);if(u){$('reader').hidden=false;$('reader').innerHTML=`<h2>ই-পেপার PDF</h2><iframe title="ই-পেপার PDF" src="${esc(u)}#toolbar=1&navpanes=0"></iframe>`;$('reader').scrollIntoView({behavior:'smooth'});}}const h=e.target.closest('[data-html]');if(h)openHtml(h.dataset.html,h.dataset.title||'ই-পেপার');});load();
</script></body></html>
