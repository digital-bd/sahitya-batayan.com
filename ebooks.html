<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ই-বুক সংগ্রহশালা | সাহিত্য বাতায়ন</title><meta name="description" content="সাহিত্য বাতায়নের ডিজিটাল বইয়ের সংগ্রহশালা।"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&family=Noto+Serif+Bengali:wght@500;600;700;800&display=swap" rel="stylesheet"><style>
:root{--red:#941f2b;--navy:#172b46;--gold:#b99651;--ink:#20242a;--muted:#73777d;--line:#e6e2dc;--soft:#f7f5f1}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font-family:'Noto Sans Bengali',sans-serif;line-height:1.7}a{color:inherit;text-decoration:none}.top{background:var(--navy);color:#fff;padding:8px 16px;font-size:13px}.wrap{width:min(1120px,calc(100% - 30px));margin:auto}.mast{padding:22px 0;border-bottom:3px solid var(--red);display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font:800 clamp(28px,5vw,44px) 'Noto Serif Bengali',serif;color:var(--red)}.back{border:1px solid var(--line);padding:8px 12px;border-radius:4px;color:var(--navy)}h1{font:800 27px 'Noto Serif Bengali',serif;color:var(--navy);margin:25px 0 5px}.intro{color:var(--muted);margin:0 0 20px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.card{border:1px solid var(--line);background:#fff;padding:13px;border-radius:6px}.cover{width:100%;aspect-ratio:3/4;object-fit:cover;background:var(--soft);border:1px solid var(--line)}.card h2{font:700 17px 'Noto Serif Bengali',serif;color:var(--navy);margin:9px 0 2px}.meta{font-size:12px;color:var(--muted)}.desc{font-size:13px;color:#505762}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.btn{display:inline-block;padding:8px 11px;background:var(--red);color:#fff;border-radius:4px;font-size:13px;font-weight:700}.btn.alt{background:var(--navy)}.reader{margin:22px 0;padding:12px;background:var(--soft);border:1px solid var(--line)}.reader iframe{width:100%;height:min(78vh,900px);border:0;background:#fff}.empty{padding:30px;text-align:center;color:var(--muted);background:var(--soft)}footer{margin-top:50px;padding:22px;background:var(--navy);color:#fff;text-align:center;font-size:13px}@media(max-width:900px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:650px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:420px){.grid{grid-template-columns:1fr}.mast{align-items:flex-start;flex-direction:column}.back{align-self:flex-end}}
</style></head><body><div class="top">সাহিত্য, সংবাদ ও মননের দর্পণ</div><header class="wrap mast"><a class="brand" href="index.html">সাহিত্য বাতায়ন</a><a class="back" href="index.html">← প্রচ্ছদে ফিরুন</a></header><main class="wrap"><h1>ই-বুক সংগ্রহশালা</h1><p class="intro">নির্বাচিত কবিতা, গল্প, উপন্যাস, প্রবন্ধ ও গবেষণাগ্রন্থ—ডিজিটাল বই পড়ুন ও ডাউনলোড করুন।</p><div id="bookList" class="grid"><div class="empty">ই-বুক আনা হচ্ছে…</div></div><section id="reader" class="reader" hidden></section><section id="epubReader" class="reader" hidden><h2 id="epubTitle"></h2><div id="epubViewer" style="height:75vh;background:#fff"></div><div class="actions"><button class="btn alt" id="epubPrev">পূর্ববর্তী পৃষ্ঠা</button><button class="btn alt" id="epubNext">পরবর্তী পৃষ্ঠা</button></div></section></main><footer>© সাহিত্য বাতায়ন · ডিজিটাল বইয়ের সংগ্রহশালা</footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js"></script><script>
const db=window.supabase.createClient('https://wiaovopnunhdzcjfchkv.supabase.co','sb_publishable_A4bEGZp8sZyRBTC1MmY61A_wFWf6Eld');const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function safeUrl(s){if(!s)return '';try{const u=new URL(s);return ['https:','http:'].includes(u.protocol)?u.href:''}catch(e){return ''}}
async function load(){const {data,error}=await db.from('ebooks').select('id,title,subtitle,author_name,category,description,cover_image_url,pdf_url,epub_url,published_at').eq('is_published',true).order('published_at',{ascending:false,nullsFirst:false}).limit(300);if(error){$('bookList').innerHTML='<div class="empty">ই-বুক লোড করা যায়নি। Migration ও RLS Policy যাচাই করুন।<br>'+esc(error.message)+'</div>';return}const rows=data||[];$('bookList').innerHTML=rows.map(x=>`<article class="card"><img class="cover" src="${esc(safeUrl(x.cover_image_url)||'')}" alt="${esc(x.title)}" onerror="this.style.display='none'"><h2>${esc(x.title)}</h2><div class="meta">${esc(x.author_name)} · ${esc(x.category)}</div><p class="desc">${esc(x.description||'')}</p><div class="actions">${x.pdf_url?`<button class="btn" data-read="${esc(safeUrl(x.pdf_url))}">PDF পড়ুন</button><a class="btn alt" href="${esc(safeUrl(x.pdf_url))}" target="_blank" rel="noopener">PDF ডাউনলোড</a>`:''}${x.epub_url?`<button class="btn" data-epub="${esc(safeUrl(x.epub_url))}" data-title="${esc(x.title)}">EPUB পড়ুন</button><a class="btn alt" href="${esc(safeUrl(x.epub_url))}" target="_blank" rel="noopener" download>EPUB ডাউনলোড</a>`:''}</div></article>`).join('')||'<div class="empty">এখনো কোনো ই-বুক প্রকাশিত হয়নি।</div>';const id=new URLSearchParams(location.search).get('id');if(id){const x=rows.find(v=>v.id===id);if(x?.pdf_url)openPdf(x.pdf_url,x.title);}}
function openPdf(url,title){const u=safeUrl(url);if(!u)return;$('epubReader').hidden=true;$('reader').hidden=false;$('reader').innerHTML=`<h2>${esc(title)}</h2><iframe title="ই-বুক PDF" src="${esc(u)}#toolbar=1&navpanes=0"></iframe>`;$('reader').scrollIntoView({behavior:'smooth'});}let activeBook=null;function openEpub(url,title){const u=safeUrl(url);if(!u)return;if(!window.ePub){alert('EPUB পাঠক লোড হয়নি। EPUB ডাউনলোড করে পড়ুন।');return;}if(activeBook?.destroy)activeBook.destroy();$('reader').hidden=true;$('epubReader').hidden=false;$('epubTitle').textContent=title;const book=ePub(u);activeBook=book;const rendition=book.renderTo('epubViewer',{width:'100%',height:'100%',flow:'paginated'});rendition.display();$('epubPrev').onclick=()=>rendition.prev();$('epubNext').onclick=()=>rendition.next();$('epubReader').scrollIntoView({behavior:'smooth'});}document.addEventListener('click',e=>{const b=e.target.closest('[data-read]');if(b)openPdf(b.dataset.read,'ই-বুক');const ep=e.target.closest('[data-epub]');if(ep)openEpub(ep.dataset.epub,ep.dataset.title||'ই-বুক');});load();
</script></body></html>
